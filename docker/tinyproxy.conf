# HTTP proxy into the VPN. Reached only through compose's 127.0.0.1 port, so
# "Allow" admits Docker's port-forwarding address; the Mac is the only client.
User nobody
Group nogroup
Port 8080
Listen 0.0.0.0
Timeout 600
MaxClients 200
Allow 0.0.0.0/0
# No ConnectPort lines: CONNECT (HTTPS tunnels) to any port, like the VPN itself.
DisableViaHeader Yes
LogLevel Warning
